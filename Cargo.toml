[workspace]
members = ["macros", "components", "utils", "sdk"]

resolver = "2"
package.edition = "2024"
package.version = "0.2.0"

[workspace.dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "e1c63426fd39018223480ee354ae3e8485ab8e2a", features = ["router", "launch", "lib"], default-features = false }
http = "1.4.2"
js-sys = "0.3.102"
num-traits = "0.2.19"
serde = "1"
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2.0.18"
time = { version = "0.3", features = ["serde", "serde-human-readable", "wasm-bindgen", "macros", "formatting"] }
validator = { version = "0.20.0", features = ["derive"], default-features = false }
# Pinned: must match the wasm-bindgen CLI worker-build invokes, and stay ABI-compatible with js-sys/web-sys 0.3.
wasm-bindgen = { version = "0.2.125" }
web-sys = "0.3.102"

# local crates
ds-components = { path = "./components" }
ds-macros = { path = "./macros" }
ds-utils = { path = "./utils", default-features = false }
