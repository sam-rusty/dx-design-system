[package]
name = "ds-components"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true }
js-sys = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum_macros = { workspace = true }
time = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Blob", "Clipboard", "Comment", "DataTransfer", "Document", "DomRect", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList", "FileReader", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "MediaQueryList", "Navigator", "Node", "NodeList", "Storage", "Window"] }

ds-macros = { workspace = true }
ds-utils = { workspace = true }

[features]
default = ["full"]
# Component families. Each family pulls in the families it renders with, so an
# explicit list stays minimal: `default-features = false, features = ["form"]`.
full = [
    "calendar",
    "charts",
    "data-table",
    "date-picker",
    "display",
    "feedback",
    "form",
    "nav",
    "overlay",
    "rich-text",
]
calendar = ["dep:time"]
charts = []
data-table = ["feedback", "form"]
date-picker = ["calendar", "form", "overlay"]
display = []
feedback = []
form = ["feedback", "dep:validator", "dep:time"]
nav = ["feedback", "overlay"]
overlay = []
rich-text = ["form", "overlay"]
web = ["dioxus/web", "ds-utils/web", "dep:js-sys", "dep:wasm-bindgen"]

[dev-dependencies]
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "e1c63426fd39018223480ee354ae3e8485ab8e2a" }
