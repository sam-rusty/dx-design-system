[package]
name = "ds-components"
version.workspace = true
edition.workspace = true

[dependencies]
dioxus = { workspace = true }
js-sys = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum_macros = { workspace = true }
time = { workspace = true }
validator = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Blob", "Clipboard", "DataTransfer", "Document", "DomRect", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList", "FileReader", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "MediaQueryList", "Navigator", "Node", "Storage", "Window"] }

ds-macros = { workspace = true }
ds-utils = { workspace = true }

[features]
web = ["dioxus/web", "ds-utils/web", "dep:js-sys", "dep:wasm-bindgen"]

[dev-dependencies]
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "e1c63426fd39018223480ee354ae3e8485ab8e2a" }
