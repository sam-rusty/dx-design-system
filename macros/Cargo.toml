[package]
name = "macros"
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
utils = { workspace = true, features = ["server"] }

# Lets `DbEnum`-emitted `#[cfg(feature = "server")]` impls light up
# inside this crate's own integration tests. No effect on macro output;
# downstream crates still gate via their own `server` feature.
[features]
server = []
